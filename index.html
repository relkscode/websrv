<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сервис на обслуживании</title>
<style>
  :root {
    --bg-1: #0f172a;
    --bg-2: #1e293b;
    --accent: #38bdf8;
    --accent-2: #818cf8;
    --text: #e2e8f0;
    --muted: #94a3b8;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(circle at 50% 20%, var(--bg-2), var(--bg-1));
    color: var(--text);
    overflow: hidden;
    position: relative;
  }

  .bg-glow {
    position: absolute;
    width: 60vmax;
    height: 60vmax;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(56,189,248,0.15), transparent 70%);
    top: -20vmax;
    left: -10vmax;
    filter: blur(10px);
    animation: drift 12s ease-in-out infinite alternate;
  }

  .bg-glow.two {
    background: radial-gradient(circle, rgba(129,140,248,0.15), transparent 70%);
    top: auto;
    bottom: -25vmax;
    left: auto;
    right: -15vmax;
    animation-delay: -6s;
  }

  @keyframes drift {
    from { transform: translate(0, 0) scale(1); }
    to { transform: translate(3vmax, 4vmax) scale(1.1); }
  }

  .card {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 3.5rem 3rem;
    max-width: 32rem;
    width: 90%;
  }

  .icon {
    width: 96px;
    height: 96px;
    margin: 0 auto 2rem;
    position: relative;
  }

  .icon svg {
    width: 100%;
    height: 100%;
    animation: spin 6s linear infinite;
    transform-origin: 50% 50%;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .icon .dot {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 14px;
    height: 14px;
    margin: -7px 0 0 -7px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 20px 4px rgba(56,189,248,0.6);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.4); opacity: 0.6; }
  }

  h1 {
    font-size: clamp(1.6rem, 4vw, 2.2rem);
    font-weight: 700;
    margin: 0 0 0.75rem;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  p {
    color: var(--muted);
    font-size: 1.05rem;
    line-height: 1.6;
    margin: 0 0 2rem;
  }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem 1.1rem;
    border-radius: 999px;
    background: rgba(56,189,248,0.08);
    border: 1px solid rgba(56,189,248,0.25);
    color: var(--accent);
    font-size: 0.85rem;
    letter-spacing: 0.02em;
  }

  .status .blip {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 1.6s ease-in-out infinite;
  }

  footer {
    margin-top: 2.5rem;
    font-size: 0.8rem;
    color: #64748b;
  }
</style>
</head>
<body>

  <div class="bg-glow"></div>
  <div class="bg-glow two"></div>

  <main class="card">
    <div class="icon">
      <svg viewBox="0 0 100 100" fill="none">
        <circle cx="50" cy="50" r="42" stroke="url(#grad)" stroke-width="4" stroke-dasharray="10 12" stroke-linecap="round"/>
        <defs>
          <linearGradient id="grad" x1="0" y1="0" x2="100" y2="100">
            <stop offset="0%" stop-color="#38bdf8"/>
            <stop offset="100%" stop-color="#818cf8"/>
          </linearGradient>
        </defs>
      </svg>
      <div class="dot"></div>
    </div>

    <h1>Сервис временно не обслуживается</h1>
    <p>Мы проводим технические работы, чтобы сделать сервис лучше.<br>Скоро всё снова заработает — спасибо за терпение.</p>

    <span class="status"><span class="blip"></span> Ведутся работы</span>

    <footer>&copy; <span id="year"></span> websrv</footer>
  </main>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
