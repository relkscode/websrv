<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline Runner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root{
    --paper: #ffffff;
    --ink: #202124;
    --ink-soft: #70757a;
    --line: #dadce0;
  }

  *{ box-sizing: border-box; }

  html, body{
    height: 100%;
    margin: 0;
  }

  body{
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: var(--paper);
    color: var(--ink);
    font-family: "JetBrains Mono", ui-monospace, monospace;
    transition: background-color 0.25s ease, color 0.25s ease;
    overflow-x: hidden;
  }

  body.night{
    --paper: #202124;
    --ink: #e8eaed;
    --ink-soft: #9aa0a6;
    --line: #3c4043;
  }

  .frame{
    width: min(92vw, 760px);
    padding: 0 0.5rem;
  }

  .error-line{
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.72rem;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    margin-bottom: 1.1rem;
  }

  .error-line svg{ flex: none; }
  .error-line svg path, .error-line svg line{ stroke: var(--ink-soft); }

  .game-wrap{
    position: relative;
    border-bottom: 2px solid var(--ink);
    line-height: 0;
  }

  canvas#game{
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 800 / 220;
    image-rendering: pixelated;
  }

  .hint{
    margin-top: 0.9rem;
    font-size: 0.68rem;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
    text-align: center;
  }

  .hint kbd{
    font-family: inherit;
    border: 1px solid var(--line);
    border-bottom-width: 2px;
    border-radius: 3px;
    padding: 0.05rem 0.35rem;
    font-size: 0.65rem;
  }

  @media (prefers-reduced-motion: reduce){
    body{ transition: none; }
  }
</style>
</head>
<body>

<div class="frame">
  <div class="error-line">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
      <path d="M2 6.5C5.5 3.2 10.5 3.2 14 6.5" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M4.2 9C6.3 7.1 9.7 7.1 11.8 9" stroke-width="1.3" stroke-linecap="round"/>
      <line x1="1.5" y1="1.5" x2="14.5" y2="14.5" stroke-width="1.3" stroke-linecap="round"/>
      <circle cx="8" cy="12.2" r="1" fill="none"/>
    </svg>
    <span>ERR_SERVICE_UNAVAILABLE — сервис временно недоступен</span>
  </div>

  <div class="game-wrap">
    <canvas id="game"></canvas>
  </div>

  <p class="hint">
    <kbd>Space</kbd> / <kbd>↑</kbd> — прыжок · <kbd>↓</kbd> — пригнуться · пока чиним, можно поиграть
  </p>
</div>

<script>
(function(){
  "use strict";

  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  var body = document.body;

  var W = 800, H = 220;
  var GROUND_Y = 190;
  var dpr = Math.max(1, window.devicePixelRatio || 1);

  function resize(){
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener("resize", resize);

  var reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---------- audio (tiny WebAudio beeps, no asset files) ----------
  var actx = null;
  function beep(freq, dur, type){
    try{
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      var osc = actx.createOscillator();
      var gain = actx.createGain();
      osc.type = type || "square";
      osc.frequency.value = freq;
      gain.gain.value = 0.05;
      osc.connect(gain);
      gain.connect(actx.destination);
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      osc.stop(actx.currentTime + dur);
    }catch(e){}
  }

  // ---------- dino ----------
  var GRAVITY = 2600;
  var JUMP_V = -760;
  var STAND_W = 44, STAND_H = 47;
  var DUCK_W = 58, DUCK_H = 27;
  var DINO_X = 60;

  var dino = {
    y: GROUND_Y - STAND_H,
    vy: 0,
    ducking: false,
    onGround: true,
    legPhase: 0
  };

  function dinoRect(){
    var w = dino.ducking ? DUCK_W : STAND_W;
    var h = dino.ducking ? DUCK_H : STAND_H;
    return { x: DINO_X, y: dino.onGround ? GROUND_Y - h : dino.y, w: w, h: h };
  }

  function jump(){
    if (dino.onGround && state === "running"){
      dino.vy = JUMP_V;
      dino.onGround = false;
      beep(520, 0.08, "square");
    }
  }

  function setDuck(on){
    if (on && dino.onGround) dino.ducking = true;
    if (!on) dino.ducking = false;
  }

  // ---------- obstacles ----------
  var obstacles = [];
  var nextSpawnAt = 0;

  function spawnObstacle(distance){
    var r = Math.random();
    if (r < 0.62){
      // cactus (single, double or triple block)
      var blocks = 1 + Math.floor(Math.random() * 3);
      var bw = 14, gap = 4;
      var totalW = blocks * bw + (blocks - 1) * gap;
      var bh = 32 + Math.random() * 18;
      obstacles.push({
        type: "cactus", blocks: blocks, bw: bw, gap: gap,
        x: W + 10, y: GROUND_Y - bh, w: totalW, h: bh
      });
    } else {
      // low-flying bird — must duck, not jump
      var bh2 = 30, bw2 = 46;
      obstacles.push({
        type: "bird", x: W + 10, y: GROUND_Y - STAND_H - bh2 + 14,
        w: bw2, h: bh2, wingPhase: 0
      });
    }
  }

  // ---------- ground texture + clouds ----------
  var groundMarks = [];
  for (var i = 0; i < 40; i++){
    groundMarks.push({ x: Math.random() * W, w: 8 + Math.random() * 14, up: Math.random() < 0.5 });
  }
  var clouds = [];
  for (var c = 0; c < 3; c++){
    clouds.push({ x: Math.random() * W, y: 30 + Math.random() * 50, s: 0.7 + Math.random() * 0.6 });
  }

  // ---------- game state ----------
  var state = "idle"; // idle | running | gameover
  var speed = 300;
  var distance = 0;
  var score = 0;
  var lastMilestone = 0;
  var lastNight = 0;
  var isNight = false;
  var highScore = 0;
  try{ highScore = parseInt(localStorage.getItem("offline-runner-hi") || "0", 10) || 0; }catch(e){}

  function reset(){
    obstacles.length = 0;
    dino.y = GROUND_Y - STAND_H;
    dino.vy = 0;
    dino.ducking = false;
    dino.onGround = true;
    speed = 300;
    distance = 0;
    score = 0;
    lastMilestone = 0;
    lastNight = 0;
    nextSpawnAt = 900;
    state = "running";
  }

  function gameOver(){
    state = "gameover";
    beep(160, 0.25, "sawtooth");
    if (score > highScore){
      highScore = score;
      try{ localStorage.setItem("offline-runner-hi", String(highScore)); }catch(e){}
    }
  }

  function rectsOverlap(a, b){
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  // ---------- input ----------
  function handleStart(){
    if (state === "idle") reset();
    else if (state === "gameover") reset();
    else jump();
  }

  window.addEventListener("keydown", function(e){
    if (e.code === "Space" || e.code === "ArrowUp"){
      e.preventDefault();
      handleStart();
    } else if (e.code === "ArrowDown"){
      e.preventDefault();
      if (state === "running") setDuck(true);
    }
  });
  window.addEventListener("keyup", function(e){
    if (e.code === "ArrowDown") setDuck(false);
  });
  canvas.addEventListener("pointerdown", function(e){
    e.preventDefault();
    handleStart();
  });

  // ---------- update ----------
  function update(dt){
    if (state !== "running") return;

    speed = Math.min(650, speed + 4 * dt);
    distance += speed * dt;
    score = Math.floor(distance / 8);

    if (score - lastMilestone >= 100){
      lastMilestone = score;
      beep(880, 0.06, "square");
    }
    if (score - lastNight >= 700){
      lastNight = score;
      isNight = !isNight;
      body.classList.toggle("night", isNight);
    }

    // dino physics
    if (!dino.onGround){
      dino.vy += GRAVITY * dt;
      dino.y += dino.vy * dt;
      if (dino.y >= GROUND_Y - STAND_H){
        dino.y = GROUND_Y - STAND_H;
        dino.vy = 0;
        dino.onGround = true;
      }
    }
    dino.legPhase += dt * (dino.onGround ? 10 : 0);

    // obstacles
    nextSpawnAt -= speed * dt;
    if (nextSpawnAt <= 0){
      spawnObstacle(distance);
      var minGap = 220 + speed * 0.5;
      nextSpawnAt = minGap + Math.random() * 260;
    }
    for (var i = obstacles.length - 1; i >= 0; i--){
      var o = obstacles[i];
      o.x -= speed * dt;
      if (o.type === "bird") o.wingPhase += dt * 8;
      if (o.x + o.w < -10) obstacles.splice(i, 1);
    }

    var hit = dinoRect();
    for (var j = 0; j < obstacles.length; j++){
      if (rectsOverlap(hit, obstacles[j])){
        gameOver();
        break;
      }
    }

    // ground marks recycle
    for (var m = 0; m < groundMarks.length; m++){
      groundMarks[m].x -= speed * dt;
      if (groundMarks[m].x < -20) groundMarks[m].x = W + Math.random() * 40;
    }
    for (var k = 0; k < clouds.length; k++){
      clouds[k].x -= speed * dt * 0.15;
      if (clouds[k].x < -60) clouds[k].x = W + Math.random() * 60;
    }
  }

  // ---------- draw ----------
  function drawDino(){
    var r = dinoRect();
    ctx.fillStyle = getComputedStyle(body).getPropertyValue("--ink").trim() || "#202124";

    if (dino.ducking){
      // low crouched body
      ctx.fillRect(r.x, r.y + 10, r.w - 10, r.h - 10);
      ctx.fillRect(r.x + r.w - 18, r.y, 18, r.h);
      ctx.fillRect(r.x + r.w - 6, r.y + 4, 5, 5); // eye
    } else {
      // torso
      ctx.fillRect(r.x + 6, r.y + 12, r.w - 14, r.h - 12);
      // head
      ctx.fillRect(r.x + r.w - 20, r.y, 20, 20);
      ctx.fillRect(r.x + r.w - 6, r.y + 5, 5, 5); // eye
      // tail
      ctx.fillRect(r.x - 8, r.y + 14, 12, 8);
      // legs: tucked mid-air, alternating while running, planted when still
      if (!dino.onGround){
        ctx.fillRect(r.x + 8, r.y + r.h - 6, 8, 6);
        ctx.fillRect(r.x + r.w - 16, r.y + r.h - 6, 8, 6);
      } else if (state === "running"){
        var lp = Math.floor(dino.legPhase) % 2;
        if (lp === 0){
          ctx.fillRect(r.x + 6, r.y + r.h - 10, 8, 10);
          ctx.fillRect(r.x + r.w - 18, r.y + r.h - 4, 8, 4);
        } else {
          ctx.fillRect(r.x + 6, r.y + r.h - 4, 8, 4);
          ctx.fillRect(r.x + r.w - 18, r.y + r.h - 10, 8, 10);
        }
      } else {
        ctx.fillRect(r.x + 8, r.y + r.h - 8, 8, 8);
        ctx.fillRect(r.x + r.w - 16, r.y + r.h - 8, 8, 8);
      }
      // arm
      ctx.fillRect(r.x + r.w - 22, r.y + 20, 8, 4);
    }
  }

  function drawObstacles(){
    var ink = getComputedStyle(body).getPropertyValue("--ink").trim() || "#202124";
    ctx.fillStyle = ink;
    obstacles.forEach(function(o){
      if (o.type === "cactus"){
        for (var b = 0; b < o.blocks; b++){
          var bx = o.x + b * (o.bw + o.gap);
          var bh = o.h * (b % 2 === 0 ? 1 : 0.72);
          ctx.fillRect(bx, GROUND_Y - bh, o.bw, bh);
          ctx.fillRect(bx - 5, GROUND_Y - bh + 8, 5, 6);
        }
      } else {
        var flap = Math.sin(o.wingPhase) > 0;
        ctx.fillRect(o.x + 12, o.y + 10, 22, 8);
        if (flap){
          ctx.fillRect(o.x, o.y, 16, 6);
          ctx.fillRect(o.x + 30, o.y, 16, 6);
        } else {
          ctx.fillRect(o.x, o.y + 16, 16, 6);
          ctx.fillRect(o.x + 30, o.y + 16, 16, 6);
        }
      }
    });
  }

  function drawGround(){
    var ink = getComputedStyle(body).getPropertyValue("--ink").trim() || "#202124";
    ctx.strokeStyle = ink;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y + 1);
    ctx.lineTo(W, GROUND_Y + 1);
    ctx.stroke();

    ctx.fillStyle = ink;
    groundMarks.forEach(function(m){
      ctx.fillRect(m.x, GROUND_Y + (m.up ? 4 : 8), m.w, 2);
    });
  }

  function drawClouds(){
    var soft = getComputedStyle(body).getPropertyValue("--ink-soft").trim() || "#70757a";
    ctx.fillStyle = soft;
    clouds.forEach(function(cl){
      var s = cl.s;
      ctx.fillRect(cl.x, cl.y, 34 * s, 8 * s);
      ctx.fillRect(cl.x + 8 * s, cl.y - 6 * s, 20 * s, 8 * s);
    });
  }

  function drawScore(){
    var ink = getComputedStyle(body).getPropertyValue("--ink").trim() || "#202124";
    ctx.fillStyle = ink;
    ctx.font = "12px 'Press Start 2P', monospace";
    ctx.textBaseline = "top";
    var scoreStr = String(Math.floor(score)).padStart(5, "0");
    ctx.textAlign = "right";
    ctx.fillText(scoreStr, W - 14, 14);
    if (highScore > 0){
      var hiStr = "HI " + String(highScore).padStart(5, "0");
      var scoreW = ctx.measureText(scoreStr).width;
      ctx.fillText(hiStr, W - 14 - scoreW - 26, 14);
    }
    ctx.textAlign = "left";
  }

  function drawOverlay(){
    var ink = getComputedStyle(body).getPropertyValue("--ink").trim() || "#202124";
    ctx.fillStyle = ink;
    ctx.textAlign = "center";
    if (state === "idle"){
      ctx.font = "11px 'Press Start 2P', monospace";
      ctx.fillText("PRESS SPACE TO START", W / 2, GROUND_Y - 90);
    } else if (state === "gameover"){
      ctx.font = "14px 'Press Start 2P', monospace";
      ctx.fillText("GAME OVER", W / 2, GROUND_Y - 100);
      ctx.font = "10px 'Press Start 2P', monospace";
      ctx.fillText("PRESS SPACE TO RESTART", W / 2, GROUND_Y - 76);
      drawRestartIcon(W / 2, GROUND_Y - 45);
    }
    ctx.textAlign = "left";
  }

  function drawRestartIcon(cx, cy){
    var ink = getComputedStyle(body).getPropertyValue("--ink").trim() || "#202124";
    ctx.strokeStyle = ink;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(cx, cy, 12, Math.PI * 0.15, Math.PI * 1.7);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx + 10, cy - 8);
    ctx.lineTo(cx + 15, cy - 3);
    ctx.lineTo(cx + 7, cy - 1);
    ctx.closePath();
    ctx.fillStyle = ink;
    ctx.fill();
  }

  function render(){
    var paper = getComputedStyle(body).getPropertyValue("--paper").trim() || "#ffffff";
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = paper;
    ctx.fillRect(0, 0, W, H);

    drawClouds();
    drawGround();
    drawObstacles();
    drawDino();
    drawScore();
    drawOverlay();
  }

  // ---------- loop ----------
  var lastT = null;
  function loop(t){
    if (lastT === null) lastT = t;
    var dt = Math.min(0.033, (t - lastT) / 1000);
    lastT = t;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  var started = false;
  function start(){
    if (started) return;
    started = true;
    render();
    requestAnimationFrame(loop);
  }

  if (document.fonts && document.fonts.ready){
    document.fonts.ready.then(start);
    setTimeout(start, 400); // fallback in case fonts.ready stalls
  } else {
    start();
  }
})();
</script>
</body>
</html>
